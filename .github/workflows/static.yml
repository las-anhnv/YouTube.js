name: Deploy YouTubei JS Bundle

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build JS Bundle
        run: npm run build

      - name: Create Metadata file
        run: |
          # Lưu ý: metadata.json được tạo vào thư mục bundle
          echo "{\"version\": \"${{ github.sha }}\"}" > bundle/metadata.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ĐÃ ĐỔI THÀNH 'bundle' VÌ ĐÂY LÀ NƠI CHỨA FILE browser.js
          path: './bundle'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
